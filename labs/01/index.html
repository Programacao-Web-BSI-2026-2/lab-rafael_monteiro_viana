<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte ao cliente</title>
    <meta name="description" content="Entre em contato">
</head>

<body>
    <header id="cabecalho">
        <a href="../../index.html">Voltar ao Início</a>
        <h1 class="titulo">Área de Contato do Cliente</h1>
        <nav class="menu">
            <a href="#">Ajuda</a> <span>|</span> <a href="#">Sair</a>
        </nav>
    </header>

    <main id="corpo-da-pagina">
        <article>
            <h2 class="subtitulo">Envie sua mensagem para a nossa equipe de suporte backend</h2>
            
            <form action="/enviar" method="POST">
                <label for="nome">Nome: </label> 
                <input type="text" name="nome" id="nome" minlength="10" required><br><br>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" minlength="10" required><br><br>
                <label for="celular">Telefone Celular: </label>
                <input type="tel" name="celular" pattern="[0-9]{11}" maxlength="11" minlength="11" inputmode="numeric" required id="celular"><br><br>
                <label for="msg">Mensagem: </label>
                <textarea name="msg" id="msg"></textarea><br><br>
                
                <input type="button" value="Disparar Dados">
            </form>
        </article>
    </main>

    <footer id="rodape">
        <p>Suporte Tech 2026</p> 
    </footer>
</body>
